// ai_agent_rpc.proto
// 主入口文件 - 导入所有拆分后的 proto 文件
// 保持向后兼容，通过单一导入获取所有类型

syntax = "proto3";
package aiagent.rpc;

option java_package = "com.asakii.rpc.proto";
option java_multiple_files = true;
option java_outer_classname = "AiAgentRpcProto";

// 导入所有拆分后的 proto 文件
import "common.proto";
import "content.proto";
import "stream.proto";
import "message.proto";
import "session.proto";
import "history.proto";
import "mcp.proto";
import "background.proto";
import "permission.proto";
import "ide.proto";

// 此文件现在仅作为入口点，所有类型定义已拆分到各自的文件中：
//
// common.proto      - 基础枚举（Provider, SessionStatus, ContentStatus, PermissionMode, SandboxMode）
// content.proto     - 内容块（ContentBlock, TextBlock, ToolUseBlock 等）
// stream.proto      - 流式事件（StreamEvent, Delta, Usage）
// message.proto     - RPC 消息（RpcMessage, UserMessage, AssistantMessage 等）
// session.proto     - 会话管理（ConnectOptions, ConnectResult, Capabilities）
// history.proto     - 历史会话（History, HistorySession, TruncateHistory）
// mcp.proto         - MCP 相关（McpServerStatus, McpToolInfo）
// background.proto  - 后台任务（BashBackgroundResult, UnifiedBackgroundResult）
// permission.proto  - 权限请求（PermissionUpdate, RequestPermission）
// ide.proto         - IDE 集成（IdeSettings, ThemeChangedNotify, ServerCallRequest）
