// mcp.proto
// MCP 相关定义

syntax = "proto3";
package aiagent.rpc;

option java_package = "com.asakii.rpc.proto";
option java_multiple_files = true;

// ============================================================================
// MCP 状态管理
// ============================================================================

// MCP 服务器状态信息
message McpServerStatus {
  string name = 1;
  string status = 2;  // "connected" | "failed" | "sdk"
  optional string server_info = 3;  // JSON 格式的服务器详细信息
}

// MCP 状态查询结果
message McpStatusResult {
  repeated McpServerStatus servers = 1;
}

// Chrome 扩展状态查询结果
message ChromeStatusResult {
  bool installed = 1;           // 扩展是否已安装
  bool enabled = 2;             // 是否在配置中启用
  bool connected = 3;           // MCP 服务器是否已连接
  optional string mcp_server_status = 4;   // MCP 服务器状态字符串
  optional string extension_version = 5;   // 扩展版本号
}

// MCP 服务器重连请求
message ReconnectMcpRequest {
  string server_name = 1;       // 要重连的服务器名称
}

// MCP 服务器重连结果
message ReconnectMcpResult {
  bool success = 1;             // 重连是否成功
  string server_name = 2;       // 服务器名称
  optional string status = 3;   // 重连后的状态
  int32 tools_count = 4;        // 可用工具数量
  optional string error = 5;    // 错误信息
}

// MCP 工具列表请求
message GetMcpToolsRequest {
  optional string server_name = 1;  // 服务器名称，空表示获取所有服务器的工具
}

// MCP 工具信息
message McpToolInfo {
  string name = 1;              // 工具名称（原始 MCP 工具名）
  string description = 2;       // 工具描述
  optional string input_schema = 3;  // 输入参数 JSON Schema（JSON 字符串）
}

// MCP 工具列表结果
message GetMcpToolsResult {
  optional string server_name = 1;  // 服务器名称过滤条件
  repeated McpToolInfo tools = 2;   // 工具列表
  int32 count = 3;                  // 工具数量
}
